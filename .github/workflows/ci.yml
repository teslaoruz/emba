name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    name: end-to-end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      EMBA_HOST: qt
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install PySide6
      - name: Hook, CLI and host compile
        run: python -m py_compile hook/emba-hook hook/hooks.py bin/emba desktop/host.py desktop/capture.py voice/voice.py
      - name: End-to-end
        run: python tests/test_e2e.py
      - name: Host log on failure
        if: failure()
        run: python bin/emba run
        timeout-minutes: 1

  screens:
    name: screenshots (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      EMBA_HOST: qt
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: X server and Qt libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0
      - run: python -m pip install PySide6
      - name: Pictures on the real display
        if: runner.os != 'Linux'
        run: python tests/screens.py screens
      - name: Pictures on X11
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python tests/screens.py screens
      - uses: actions/upload-artifact@v4
        with:
          name: screens-${{ matrix.os }}
          path: screens/

  installer:
    name: installer syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n install.sh
      - run: python -c "import json, pathlib; [json.loads(p.read_text()) for p in pathlib.Path('plugins').glob('*/plugin.json')]"
