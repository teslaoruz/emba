name: Something is wrong
description: Emba crashed, missed something, or did the wrong thing
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we see it too?
      placeholder: "1. Start a Claude Code session\n2. ..."
  - type: textarea
    id: doctor
    attributes:
      label: Output of `emba doctor`
      render: text
  - type: input
    id: system
    attributes:
      label: System
      placeholder: "e.g. Arch Linux + Hyprland, macOS 15, Windows 11"
    validations:
      required: true
  - type: input
    id: agents
    attributes:
      label: Agents and versions
      placeholder: "e.g. Claude Code 2.1, Codex 0.120"
